plugins {
    id 'java'
    id 'application'
}

group = 'lastpencil'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

application {
    mainClass = 'lastpencil.Main'
}

run {
    standardInput = System.in
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
