[tools]
java = "21"

[tasks."run:last-pencil"]
description = "Run the Last Pencil game"
run = "./gradlew --quiet --console=plain :last-pencil:run"

[tasks."run:ascii-mirror"]
description = "Run the ASCII Mirror application"
run = "./gradlew --quiet --console=plain :ascii-mirror:run"

[tasks."run:guess-the-animal"]
description = "Run the Guess the Animal game"
run = "./gradlew --quiet --console=plain :guess-the-animal:run"

[tasks.build]
description = "Build all projects"
run = "./gradlew build"
